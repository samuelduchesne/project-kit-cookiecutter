# DVC Pipeline Definition
# Run with: dvc repro
# See: https://dvc.org/doc/user-guide/project-structure/dvcyaml-files

stages:
  # Data preparation stage
  prepare:
    cmd: uv run python {% if cookiecutter.layout == "src" %}src/{% endif %}{{ cookiecutter.project_slug }}/prepare.py
    deps:
      - data/raw
      - {% if cookiecutter.layout == "src" %}src/{% endif %}{{ cookiecutter.project_slug }}/prepare.py
    params:
      - prepare
    outs:
      - data/processed

