{%- set min_ver = cookiecutter.minimum_python_version %}
{%- set versions = ["3.9", "3.10", "3.11", "3.12", "3.13", "3.14"] %}
{%- set min_idx = versions.index(min_ver) %}
[tox]
skipsdist = true
envlist = {% for ver in versions[min_idx:] %}py{{ ver | replace('.', '') }}{% if not loop.last %}, {% endif %}{% endfor %}

[gh-actions]
python =
{%- for ver in versions[min_idx:] %}
    {{ ver }}: py{{ ver | replace('.', '') }}
{%- endfor %}

[testenv]
passenv = PYTHON_VERSION
allowlist_externals = uv
commands =
    uv sync --python {envpython}
    uv run python -m pytest --doctest-modules tests --cov --cov-config=pyproject.toml --cov-report=xml
    {% if cookiecutter.type_checker == "mypy" %}mypy{% elif cookiecutter.type_checker in ["ty", "pyrefly"] %}{{ cookiecutter.type_checker }} check{% else %}pyright{% endif %}
