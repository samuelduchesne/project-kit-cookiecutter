repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: "v6.0.0"
    hooks:
      - id: check-case-conflict
      - id: check-merge-conflict
      - id: check-yaml
        exclude: ^pnpm-lock\.yaml$ # pnpm writes the lockfile as several YAML documents
      - id: check-json
      - id: end-of-file-fixer
      - id: trailing-whitespace

  # Biome lints and formats TypeScript, JavaScript and JSON. It runs the version in package.json,
  # so install dependencies (make install) before committing.
  - repo: local
    hooks:
      - id: biome-check
        name: biome check
        entry: pnpm exec biome check --write --no-errors-on-unmatched --files-ignore-unknown=true
        language: system
        types_or: [javascript, jsx, ts, tsx, json]
        pass_filenames: true
